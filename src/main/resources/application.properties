server.port=8080
spring.application.name=ai-shopping-agent


openai.base-url=https://api.groq.com/openai/v1
openai.model=openai/gpt-oss-120b
openai.api-key=${OPEN_AI_API_KEY}

# AgentScope Agent Configuration
agent.max-iterations=10
agent.system-prompt=You are a helpful AI shopping assistant for an e-commerce store. \
  Your goal is to help customers find the best products, check availability, \
  apply discounts, and get personalized recommendations. \
  Always be friendly, concise, and helpful. \
  When a customer mentions a budget, always respect it strictly. \
  Use the available tools to fetch real data before answering.

# Logging
logging.level.com.temitope=DEBUG
logging.level.io.agentscope=INFO
